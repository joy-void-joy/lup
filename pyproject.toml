[project]
name = "lup-template"
version = "0.2.0"
description = "Self-improving agent template with feedback loop, built with the Claude Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = [
    "agent",
    "ai",
    "claude",
    "feedback-loop",
    "llm",
    "self-improving",
    "template",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.139.0",
    "lup[claude,codex,docker]",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "sh>=2.2.2",
    "tomlkit>=0.15.0",
    "typer>=0.21.1",
    "tzlocal>=5.4.3",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
lup = "lup_template.environment.cli.__main__:app"
lup-devtools = "lup_template.devtools.main:app"

[project.urls]
Homepage = "https://github.com/joy-void-joy/lup"
Repository = "https://github.com/joy-void-joy/lup"
Issues = "https://github.com/joy-void-joy/lup/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lup_template.devtools.dev" = ["*.css"]
"lup_template.devtools.dashboard" = ["assets/*.html"]
"lup_template.devtools.harness.content" = ["assets/*.js", "assets/*.sh"]

[tool.lup]
agent_version = "0.2.0"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lup = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "packages/lup/src"]
addopts = "-m 'not integration'"
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
# Workspace-wide check, run from the repo root: the template (src), the
# vendored lup library (packages/lup/src), and tests. Pyright reads only this
# root config when invoked here — it does not discover the member config in
# packages/lup/pyproject.toml — so every include the workspace needs is listed.
include = ["src", "packages/lup/src", "tests"]
# Adapter asset scripts are verbatim payloads for the generated plugin tree;
# their imports resolve only in that runtime layout, not in this workspace.
exclude = [
    "packages/lup/src/lup/adapters/claude/assets",
    "packages/lup/src/lup/adapters/codex/assets",
]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ruff]
# Pinned below requires-python (>=3.14) so ruff keeps `except (A, B):`
# parenthesized. Inferring py314 would treat the parens as redundant and
# strip them, since `except A, B:` is valid syntax from 3.14 on.
target-version = "py313"
