[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# The package age gate: nothing published in the last three days resolves.
exclude-newer = "3 days"

[tool.ruff]
target-version = "py314"
# Where the workspace packages' modules live, so their imports sort as first-party.
src = ["packages/*/src"]
# The bridge's interim hooks run as uv scripts with their own dependencies, and go
# when the after-call diff is installed (`docs/judging-writes.md`).
extend-exclude = [".claude"]

[tool.ruff.format]
# Python files only: the code examples in the Markdown docs keep their own layout.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
# Each rule here overlaps or contradicts the owner its comment names: a lup rule
# (`docs/conventions.md`), pyright, or ruff's formatter; or it's a threshold that
# review owns. "Fires only on" means every finding lands on a construct the owner
# refuses outright, so it can only repeat it.
ignore = [
    # Data shapes
    "PYI024", "UP014", "SLOT002",            # fire only on named tuples: `namedtuple`
    "RUF008", "RUF009", "RUF033", "RUF049",  # fire only on dataclasses: `dataclass`
    # Names
    "PYI001",  # steers a stub's type variables to a leading underscore: `private-name`
    "PYI018", "PYI043", "PYI046", "PYI047", "PYI049", "UP049",  # fire only on private names: `private-name`
    # Dispatch
    "PLR0911",  # fights guard clauses: `elif`
    "PLR5501",  # steers an `else` holding an `if` to `elif`: `elif`
    "SIM116",   # steers `if` chains to dict lookups: `elif`, `match`
    # Constants
    "PLR2004",   # pushes values into module constants: `constant-home`
    "ASYNC109",  # flags a `timeout` parameter, which is where a duration lives: `constant-home`
    # Data shapes
    "RUF012",  # flags a model's `= []` default, which pydantic copies, since it can't see through `lup.types.Model` to pydantic: `default-factory`
    # Collections and loops
    "PLR1714",                        # steers repeated comparisons to a set literal: `set-shape`
    "PERF401", "PERF402", "PERF403",  # overlap: `collection-loop`
    # Parsing
    "B034", "FURB167",                          # fire only on `re` calls: `regex`
    "FURB166", "FURB188", "YTT101", "YTT303",  # fire only on a slice of a `str`: `string-slice`
    # Types
    "ANN001", "ANN002", "ANN003",  # pyright strict reports a parameter without a type
    "ANN401", "PYI032",            # fire only on `Any`: `any-type`
    "TC006",                       # fires only on `cast`, and steers to a quoted type: `cast`
    # Errors
    "SIM105",  # steers to `contextlib.suppress`: `suppress`
    "B022",    # fires only on `contextlib.suppress`: `suppress`
    "E722",    # overlaps: `bare-except`
    "BLE001",  # flags `except Exception`, which is the steer: `except-baseexception`
    # Libraries per job
    "PTH", "S103",  # overlap, `S103` firing only on `os.chmod`: `os-path`, `os-file-ops`
    "S602", "S603", "S604", "S605", "S606", "S607", "S609",  # fire only on process calls: `subprocess`, `os-shell`
    "ASYNC220", "ASYNC221",  # fire only on process calls, and steer to asyncio's: `subprocess`, `os-shell`
    "PLW1509", "PLW1510", "UP021", "UP022",  # fire only on `subprocess` calls: `subprocess`
    "B003", "PLE1507", "PLW1507", "PLW1508", "SIM112",  # fire only on `os.environ` and `os.getenv`: `os-environ`
    # Docstrings
    "D417",  # `Args:` sections aren't used: prose docstrings
    "D203",  # contradicts `D211`, kept as the formatter's choice: no blank line before a class docstring
    "D213",  # contradicts `D212`, kept: the summary starts on the docstring's first line
    # Suppressions and directives
    "PGH003", "PGH004", "RUF100", "RUF101", "RUF102", "RUF103", "RUF104",  # about `noqa`, `type: ignore` and ruff's own suppression comments: `suppression-comment`
    "TD",  # shapes TODO comments, where deferred work is `# lup: defer(…)`: `defer`
    # Formatting
    "COM812", "COM819",  # the formatter decides trailing commas: ruff's formatter
    "E501",              # flags long lines, which are layout: ruff's formatter
    # Size
    "C901", "PLR0912", "PLR0913", "PLR0915", "PLR1702",  # thresholds on size, not mistakes: review, until #33
    # Imports
    "PLC0415",  # flags an import inside a function, which is how an adapter imports its runtime's SDK when an ask first runs: review
    "INP001",   # flags a file outside a package, which here is a test pytest finds by path or a build script run on its own: review
    # No convention decides it
    "CPY001",  # no copyright header has been chosen: the operator's call
]
# `# lup:` directives aren't commented-out code (`ERA001`).
task-tags = ["lup"]

[tool.ruff.lint.flake8-type-checking]
# A pydantic field's type is read at runtime, so its import stays out of a
# `TYPE_CHECKING` block. Models derive from lup's bases (`lup.types`); the host
# service's requests and replies are models a module declares beside its handler,
# in a module of its own, where ruff can't follow their bases.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "lup.types.Model",
    "lup.types.MutableModel",
    "lup.types.Settings",
    "lup_dev.host.protocol.Request",
    "lup_dev.host.protocol.Reply",
]
# FastAPI reads a route's parameter and return types at runtime: a stream's
# items, its body's union. Moved under `TYPE_CHECKING`, a stream is read as a
# plain object and described as none.
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
]

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from lup's rules; ruff keeps these test-only exemptions: a
# test's stand-in token reads as a hardcoded password (`S105`, `S106`), and a
# stand-in's flag needn't be keyword-only (`FBT001`, `FBT002`).
"packages/*/tests/**" = ["S101", "D", "ARG", "S105", "S106", "FBT001", "FBT002"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
enableTypeIgnoreComments = false
# The workspace packages; scratch work under `tmp/` stays out of the gate.
include = ["packages"]
# pyright's own defaults, and what the engine's build puts in the tree: the link to
# pyright's source, whose Python samples are its tests, and the standard-library
# stubs shipped beside the built engine.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "packages/lup-dev/checker/pyright",
    "packages/lup-dev/src/lup_dev/codescan/bundle",
]

[tool.pytest]
# The package sources are collected too, so `--doctest-modules` runs their
# docstring examples as tests. The built engine beside them holds no Python.
testpaths = ["packages/*/tests", "packages/*/src"]
# `importlib` lets two packages' test modules share a name.
addopts = [
    "--doctest-modules",
    "--import-mode=importlib",
    "--ignore=packages/lup-dev/src/lup_dev/codescan/bundle",
]

[tool.importlinter]
root_packages = ["lup", "lup_dev"]
# Lets a contract name a package outside `root_packages`, such as `lup_dashboard`.
include_external_packages = true

# The library never imports the environment (`docs/conventions.md`, *Imports and boundaries*).
# A module's environment side lives in its directory of `lup` too, and imports the
# environment core it's selected through: each such module is listed here, its
# library side, where it has one, still held to the contract.
[[tool.importlinter.contracts]]
name = "lup's library never imports lup_dev or lup_dashboard"
type = "forbidden"
source_modules = ["lup"]
forbidden_modules = ["lup_dev", "lup_dashboard"]
ignore_imports = [
    "lup.github.** -> lup_dev.**",
    "lup.transcripts.** -> lup_dev.**",
]

[[tool.importlinter.contracts]]
name = "lup_dev never imports lup_dashboard"
type = "forbidden"
source_modules = ["lup_dev"]
forbidden_modules = ["lup_dashboard"]

# The judging core never names a runtime: each runtime's spellings live in its
# adapter, and only the command line lists the adapters.
[[tool.importlinter.contracts]]
name = "only lup_dev.cli imports the runtime adapters"
type = "protected"
protected_modules = ["lup_dev.adapters"]
allowed_importers = ["lup_dev.cli"]

# lup_dev's subsystems, highest first: a subpackage may import those below it,
# never those above (`docs/conventions.md`, *Package layout*).
[[tool.importlinter.contracts]]
name = "lup_dev's subsystems import downwards"
type = "layers"
containers = ["lup_dev"]
layers = ["adapters", "launch", "policy", "codescan", "declaration", "catalog", "remote | forge | clipboard", "inbox", "host"]

# git's remote helper runs on a room's own Python, which has the standard library
# alone (`docs/host-tools.md`, *git through a remote helper*): it imports nothing
# but the standard library's modules listed here, each one it uses.
[[tool.importlinter.contracts]]
name = "lup_dev.remote.helper imports the standard library alone"
type = "forbidden"
source_modules = ["lup_dev.remote.helper"]
forbidden_modules = ["*", "lup.**", "lup_dev.**"]
as_packages = false
ignore_imports = [
    "lup_dev.remote.helper -> collections",
    "lup_dev.remote.helper -> fnmatch",
    "lup_dev.remote.helper -> itertools",
    "lup_dev.remote.helper -> json",
    "lup_dev.remote.helper -> pathlib",
    "lup_dev.remote.helper -> socket",
    "lup_dev.remote.helper -> subprocess",
    "lup_dev.remote.helper -> sys",
    "lup_dev.remote.helper -> typing",
]

# The clipboard's `wl-paste` and `wl-copy` run on a room's Python too
# (`docs/host-tools.md`, *The clipboard*): the standard library's modules alone.
[[tool.importlinter.contracts]]
name = "lup_dev.clipboard.shim imports the standard library alone"
type = "forbidden"
source_modules = ["lup_dev.clipboard.shim"]
forbidden_modules = ["*", "lup.**", "lup_dev.**"]
as_packages = false
ignore_imports = [
    "lup_dev.clipboard.shim -> argparse",
    "lup_dev.clipboard.shim -> base64",
    "lup_dev.clipboard.shim -> json",
    "lup_dev.clipboard.shim -> pathlib",
    "lup_dev.clipboard.shim -> socket",
    "lup_dev.clipboard.shim -> sys",
]

# lup's MCP bridge runs on a room's Python too, as each runtime's stdio server for
# lup's tools (`lup/sessions/bridge.py`): the standard library's modules alone.
[[tool.importlinter.contracts]]
name = "lup.sessions.bridge imports the standard library alone"
type = "forbidden"
source_modules = ["lup.sessions.bridge"]
forbidden_modules = ["*", "lup.**", "lup_dev.**"]
as_packages = false
ignore_imports = [
    "lup.sessions.bridge -> collections",
    "lup.sessions.bridge -> itertools",
    "lup.sessions.bridge -> json",
    "lup.sessions.bridge -> pathlib",
    "lup.sessions.bridge -> socket",
    "lup.sessions.bridge -> sys",
    "lup.sessions.bridge -> threading",
    "lup.sessions.bridge -> time",
    "lup.sessions.bridge -> typing",
]

# A runtime's SDK is imported only in its adapter, so a project installing one
# extra never reaches the other (`docs/conventions.md`, *Imports and boundaries*).
[[tool.importlinter.contracts]]
name = "claude_agent_sdk is imported only by lup.adapters.claude"
type = "protected"
protected_modules = ["claude_agent_sdk"]
allowed_importers = ["lup.adapters.claude"]

[[tool.importlinter.contracts]]
name = "openai_codex is imported only by lup.adapters.codex"
type = "protected"
protected_modules = ["openai_codex"]
allowed_importers = ["lup.adapters.codex"]

# Nothing inside lup imports its front door, which imports the adapters, so a
# module they import would import itself in a cycle.
[[tool.importlinter.contracts]]
name = "nothing inside lup imports lup's front door"
type = "protected"
protected_modules = ["lup"]
allowed_importers = ["lup_dev.**"]
as_packages = false

[dependency-groups]
dev = [
    "import-linter>=2.15",
    # lup's own tests cover both runtimes, and run under its own guard.
    "lup[claude,codex,testing]",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.sources]
lup = { workspace = true }
