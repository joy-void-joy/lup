[project]
name = "lup-dev"
version = "0.1.0"
description = "The environment for developing a project with agents."
requires-python = ">=3.14"
dependencies = [
    "filelock>=4.0.10",
    "httpx>=0.28.1",
    # Renders a launched session's guidance from the modules' sections.
    "jinja2>=3.1",
    "lup",
    # `Transcripts`, among lup's default modules: its base alone, since `lup-dev`
    # is the environment its `environment` extra brings.
    "lup-transcripts",
    # Reads an item's text into its Markdown blocks, the parts an id names (`inbox/parts.py`).
    "markdown-it-py>=4.2.0",
    "packaging>=26.3",
    "pydantic>=2.12",
    # The gate runs a project's tests on several workers (`catalog/gate.py`).
    "pytest-xdist>=3.8.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
lup-dev = "lup_dev.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
lup = { workspace = true }
lup-transcripts = { workspace = true }
