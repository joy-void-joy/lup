[project]
name = "lup"
version = "0.2.0"
description = "Agent development library for Claude and Codex agent SDKs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = ["agent", "ai", "claude", "llm", "mcp", "sdk", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "rich>=14.3.1",
    "sh>=2.2.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.26"]
codex = []
docker = ["docker>=7.1.0"]

[project.urls]
Homepage = "https://github.com/joy-void-joy/lup"
Repository = "https://github.com/joy-void-joy/lup"
Issues = "https://github.com/joy-void-joy/lup/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lup = ["py.typed"]
"lup.adapters.claude" = ["assets/*.py"]
"lup.adapters.codex" = ["assets/*.py"]

[tool.pyright]
# Independent of the workspace-root config: this lets the standalone library
# type-check on its own (pyright run from this directory), where `src` resolves
# to packages/lup/src. The root config re-lists this path under its own include
# for the workspace-wide run; the two configs do not merge or conflict.
include = ["src"]
# Adapter asset scripts are verbatim payloads for the generated plugin tree;
# their imports resolve only in that runtime layout, not in this workspace.
exclude = ["src/lup/adapters/claude/assets", "src/lup/adapters/codex/assets"]
pythonVersion = "3.14"
