<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lup resolver supervisor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #11151d;
        --panel-raised: #171c26;
        --border: #272e3d;
        --text: #edf1f7;
        --muted: #8e98aa;
        --accent: #9b8cff;
        --accent-strong: #b9adff;
        --ok: #64d6a2;
        --danger: #ff8292;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% -10%, #26204b 0, transparent 34rem),
          radial-gradient(circle at 90% 5%, #15344a 0, transparent 30rem),
          var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, select { font: inherit; }

      .shell {
        width: min(1000px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 72px;
      }

      header { margin-bottom: 26px; }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); letter-spacing: -.045em; }
      h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.02em; }
      p { margin: 0; }

      .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px;
        background: var(--panel-raised);
        color: var(--muted);
        font-size: 13px;
      }

      .pill.strong { color: var(--text); border-color: var(--accent); }
      .pill.ok { color: var(--ok); border-color: var(--ok); }
      .pill.danger { color: var(--danger); border-color: var(--danger); }

      section {
        margin-top: 22px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
      }

      section[hidden] { display: none; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; }

      .chip {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px 9px;
        color: var(--muted);
        font-size: 12px;
      }

      tr.openable { cursor: pointer; }
      tr.openable:hover td { background: var(--panel-raised); }
      #trace-body { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; max-height: 60vh; overflow-y: auto; }
      .entry { border-left: 2px solid var(--border); padding-left: 10px; }
      .entry.note { border-left-color: var(--accent); }
      .entry-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; }
      .say { white-space: pre-wrap; }
      .think { white-space: pre-wrap; color: var(--muted); font-style: italic; }
      .call { margin-top: 4px; }
      .call strong { color: var(--accent-strong); }
      .result pre { color: var(--muted); }
      .result.bad pre { color: var(--danger); }
      .entry pre { margin: 4px 0 0; padding: 6px 8px; background: var(--panel-raised); border-radius: 6px; overflow-x: auto; font-size: 12px; max-height: 16em; }
      .pre-body {
        margin: 4px 0 0;
        padding: 6px 8px;
        background: var(--panel-raised);
        border-radius: 6px;
        overflow-x: auto;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
      .chip.done { color: var(--ok); border-color: #2c5a46; }
      .chip.current { color: var(--text); background: var(--panel-raised); border-color: var(--accent); }
      .chip-row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
      .chip-row > .muted { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; min-width: 4.5em; }
      .boundary { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; }
      .boundary::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
      .entry.unknown { border-left-color: var(--danger); }
      .expand {
        margin-top: 4px;
        padding: 1px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }
      .expand:hover { color: var(--text); border-color: var(--accent); }
      .target { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      td.reason { color: var(--muted); }
      tr:last-child td { border-bottom: 0; }

      fieldset {
        margin: 0 0 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--panel-raised);
      }

      legend { padding: 0 6px; color: var(--accent-strong); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }

      .prompt { margin-bottom: 10px; }

      .choice { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
      .choice input { margin-top: 4px; }

      .badge {
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        background: #241f45;
        color: var(--accent-strong);
        font-size: 11px;
      }

      input[type="text"] {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #0c1017;
        color: var(--text);
      }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

      button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 16px;
        background: var(--panel-raised);
        color: var(--text);
        cursor: pointer;
      }

      button.primary { background: var(--accent); border-color: var(--accent); color: #14101f; font-weight: 650; }
      button.danger { border-color: var(--danger); color: var(--danger); }
      button:disabled { opacity: .5; cursor: not-allowed; }

      code {
        display: block;
        margin-top: 10px;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #0c1017;
        color: var(--accent-strong);
        font-size: 12.5px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .error { margin-top: 10px; color: var(--danger); }
      .muted { color: var(--muted); }
      .banner { margin-top: 12px; color: var(--muted); }
      footer { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <p class="eyebrow">Resolver supervision</p>
        <h1 id="run-id">—</h1>
        <div class="pills">
          <span class="pill strong" id="phase-pill">—</span>
          <span class="pill" id="status-pill">—</span>
          <span class="pill" id="connection-pill">connecting</span>
        </div>
        <p class="banner" id="banner" hidden></p>
      </header>

      <section id="runs-section">
        <h2>Runs</h2>
        <table>
          <thead>
            <tr><th>Run</th><th>Phase</th><th>Concerns</th><th>Pending</th></tr>
          </thead>
          <tbody id="run-rows"></tbody>
        </table>
        <p class="muted" id="runs-empty" hidden>No runs recorded under .lup/resolve.</p>
      </section>

      <section id="phases-section">
        <h2>Phases</h2>
        <div class="chips" id="phase-chips"></div>
      </section>

      <section id="concerns-section">
        <h2>Concerns</h2>
        <table>
          <thead>
            <tr>
              <th>Concern</th><th>Status</th><th>Reason</th>
              <th>Depends on</th><th>Branch</th><th>Rounds</th>
            </tr>
          </thead>
          <tbody id="concern-rows"></tbody>
        </table>
        <p class="muted" id="concerns-empty" hidden>No concerns planned yet.</p>
      </section>

      <section id="trace-section">
        <h2>Trace</h2>
        <div class="chip-row"><span class="muted">Scope</span><div class="chips" id="scope-chips"></div></div>
        <div class="chip-row"><span class="muted">Actor</span><div class="chips" id="actor-chips"></div></div>
        <div id="trace-body"></div>
        <p class="muted" id="trace-empty">Nothing recorded yet.</p>
        <div class="actions">
          <input id="message-text" type="text" placeholder="Say something — it decides nothing and never parks the run" />
          <button class="primary" type="button" id="message-button">Send</button>
        </div>
        <p class="target" id="message-target"></p>
        <p class="error" id="message-error" hidden></p>
      </section>

      <section id="questions-section" hidden>
        <h2>Pending questions</h2>
        <form id="questions-form"></form>
        <div class="actions" id="questions-actions">
          <button class="primary" type="submit" form="questions-form">Submit answers</button>
          <button type="button" id="park-button">Park run</button>
          <button type="button" id="resume-button" hidden>Resume run</button>
        </div>
        <p class="error" id="questions-error" hidden></p>
        <code id="rerun-recipe" hidden></code>
      </section>

      <section id="review-section" hidden>
        <h2>Review branch</h2>
        <div id="review-body"></div>
        <p class="muted" id="review-hand-off"></p>
      </section>

      <section id="failures-section" hidden>
        <h2>Failures</h2>
        <div id="failure-list"></div>
      </section>

      <footer>
        <span id="footer-url"></span>
      </footer>
    </div>

    <script>
      let state = null;
      let source = null;
      let runs = [];
      let entries = [];
      // What the trace is showing. A concern is not one actor: its worker, the
      // reviewer that read it and the merger that joined it share an id and
      // run in different rounds, so opening a concern has to mean all of them
      // or it silently shows whichever happened to come first.
      let scope = { kind: "merged" };

      const element = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function draftKey() {
        return `lup-supervisor:${state.run_id}`;
      }

      function readDraft() {
        try {
          return JSON.parse(localStorage.getItem(draftKey()) || "{}");
        } catch (error) {
          return {};
        }
      }

      function writeDraft(answers) {
        localStorage.setItem(draftKey(), JSON.stringify(answers));
      }

      function collectAnswers() {
        const form = element("questions-form");
        const answers = [];
        for (const field of form.querySelectorAll("[data-question]")) {
          if (field.type === "radio" && !field.checked) continue;
          if (field.value === "") continue;
          answers.push({ question_id: field.dataset.question, value: field.value });
        }
        return answers;
      }

      function questionMarkup(view, draft) {
        const question = view.question;
        if (view.answered !== null) {
          return `<div class="prompt">${escapeHtml(question.prompt)}</div><p class="muted">Answered <strong>${escapeHtml(view.answered)}</strong></p>`;
        }
        const chosen = draft[question.id] ?? view.offer ?? undefined;
        const offered = view.offer !== null ? '<span class="badge">offered</span>' : "";
        const body = question.choices.length
          ? question.choices.map((choice) => {
              const checked = chosen === choice || (chosen === undefined && question.recommendation === choice);
              const badge = question.recommendation === choice ? '<span class="badge">recommended</span>' : "";
              return `<label class="choice"><input type="radio" name="${escapeHtml(question.id)}" data-question="${escapeHtml(question.id)}" value="${escapeHtml(choice)}"${checked ? " checked" : ""} /><span>${escapeHtml(choice)}${badge}</span></label>`;
            }).join("")
          : `<input type="text" data-question="${escapeHtml(question.id)}" value="${escapeHtml(chosen ?? question.recommendation ?? "")}" autocomplete="off" />`;
        return `<div class="prompt">${escapeHtml(question.prompt)}${offered}</div>${body}`;
      }

      function renderQuestions() {
        const section = element("questions-section");
        const pending = state.pending;
        const outstanding = pending.filter((view) => view.answered === null);
        section.hidden = pending.length === 0;
        element("questions-actions").hidden = outstanding.length === 0;
        element("rerun-recipe").hidden = outstanding.length === 0;
        element("rerun-recipe").textContent = state.rerun_recipe;
        element("resume-button").hidden = state.live;
        const draft = readDraft();
        const grouped = new Map();
        for (const view of pending) {
          const concern = view.question.concern_id;
          if (!grouped.has(concern)) grouped.set(concern, []);
          grouped.get(concern).push(view);
        }
        element("questions-form").innerHTML = [...grouped.entries()]
          .map(([concern, views]) =>
            `<fieldset><legend>${escapeHtml(concern)}</legend>${views.map((view) => questionMarkup(view, draft)).join("")}</fieldset>`
          )
          .join("");
      }

      function renderRuns() {
        const rows = runs.map((run) => {
          const badge = run.live ? ' <span class="badge">live</span>' : "";
          const detail = run.unreadable ? `<div class="error">${escapeHtml(run.detail)}</div>` : "";
          const current = run.run_id === state?.run_id ? " strong" : "";
          return `<tr><td><button type="button" class="pill${current}" data-run="${escapeHtml(run.run_id)}">${escapeHtml(run.run_id)}</button>${badge}${detail}</td><td class="muted">${escapeHtml(run.phase || "—")}</td><td>${run.concerns}</td><td>${run.pending_questions}</td></tr>`;
        });
        element("run-rows").innerHTML = rows.join("");
        element("runs-empty").hidden = rows.length > 0;
      }

      function renderConcerns() {
        const rows = state.concerns.map((concern) => {
          const failure = concern.failure ? `<div class="error">${escapeHtml(concern.failure)}</div>` : "";
          const approved = concern.integration_approved ? "" : ' <span class="badge">deferred</span>';
          return `<tr data-concern="${escapeHtml(concern.id)}" class="openable"><td><strong>${escapeHtml(concern.id)}</strong>${approved}<div class="muted">${escapeHtml(concern.title)}</div></td><td>${escapeHtml(concern.status)}</td><td class="reason">${escapeHtml(concern.reason || concern.eligibility_reason || "")}${failure}</td><td class="muted">${escapeHtml(concern.dependencies.join(", ") || "—")}</td><td class="muted">${escapeHtml(concern.branch || "—")}</td><td>${concern.rounds}</td></tr>`;
        });
        element("concern-rows").innerHTML = rows.join("");
        element("concerns-empty").hidden = rows.length > 0;
      }

      function actorLabel(actor) {
        return `${actor.kind}:${actor.id}#${actor.round}`;
      }

      // A body is shown whole once someone asks for it. Until then it is cut
      // at a length that still says what the block was, because a single file
      // read is longer than every other entry in the run put together and
      // renders the trace unreadable exactly where it gets interesting.
      const BODY_LIMIT = 1200;
      const expanded = new Set();

      function bodyMarkup(text, key, className) {
        const body = String(text ?? "");
        if (body.length <= BODY_LIMIT || expanded.has(key)) {
          return `<div class="${className}">${escapeHtml(body)}</div>`;
        }
        const cut = body.slice(0, BODY_LIMIT);
        const rest = body.length - BODY_LIMIT;
        return (
          `<div class="${className}">${escapeHtml(cut)}…</div>` +
          `<button type="button" class="expand" data-expand="${escapeHtml(key)}">show ${rest} more characters</button>`
        );
      }

      function blockMarkup(block, key) {
        switch (block.type) {
          case "text":
            return bodyMarkup(block.text, key, "say");
          case "thinking":
            return block.redacted
              ? `<div class="think">[redacted reasoning]</div>`
              : bodyMarkup(block.thinking, key, "think");
          case "tool_call":
            return `<div class="call"><strong>${escapeHtml(block.name)}</strong>${bodyMarkup(JSON.stringify(block.arguments, null, 2), key, "pre-body")}</div>`;
          case "tool_result":
            return `<div class="result ${block.is_error ? "bad" : ""}">${bodyMarkup(block.content, key, "pre-body")}</div>`;
          default:
            return `<div class="say muted">[${escapeHtml(block.type)}]</div>`;
        }
      }

      // A run event and a block are rendered by the same component on purpose.
      // The merged view is this list unfiltered, so a phase move has to sit in
      // the same column as the turn that caused it or the ordering buys nothing.
      //
      // Every member of both unions gets an arm, including the two that render
      // nothing. `block_started` and `block_completed` are the streaming
      // granularity of content `message_completed` already carries whole, so
      // drawing them would show every block twice; saying that here is what
      // separates a deliberate silence from an event that fell through. An
      // event this page has never heard of is drawn rather than dropped —
      // a trace that quietly omits what it cannot name is not a record.
      function entryMarkup(entry) {
        const event = entry.event;
        const stamp = new Date(entry.at).toLocaleTimeString();
        const who = actorLabel(entry.actor);
        const head = `<div class="entry-head"><span class="muted">${escapeHtml(stamp)}</span> <span class="pill">${escapeHtml(who)}</span></div>`;
        const boundary = (text) =>
          `<div class="boundary"><span>${escapeHtml(stamp)}</span><span>${escapeHtml(who)}</span><span>${escapeHtml(text)}</span></div>`;
        switch (event.type) {
          case "message_completed":
            return `<div class="entry">${head}${event.message.blocks
              .map((block, index) => blockMarkup(block, `${entry.seq}:${index}`))
              .join("")}</div>`;
          case "turn_started":
            return boundary("turn started");
          case "turn_completed":
            return boundary("turn completed");
          case "block_started":
          case "block_completed":
            return "";
          case "phase_changed":
            return `<div class="entry note">${head}<div>phase → <strong>${escapeHtml(event.phase)}</strong></div></div>`;
          case "concern_progressed":
            return `<div class="entry note">${head}<div><strong>${escapeHtml(event.progress.concern_id)}</strong> → ${escapeHtml(event.progress.status)} ${escapeHtml(event.progress.reason || "")}</div></div>`;
          case "question_asked":
            return `<div class="entry note">${head}<div>asked: ${escapeHtml(event.question.prompt)}</div></div>`;
          case "answer_settled":
            return `<div class="entry note">${head}<div>answered ${escapeHtml(event.answer.question_id)} = ${escapeHtml(event.answer.value)} <span class="muted">(${escapeHtml(event.door)})</span></div></div>`;
          case "message_posted":
            return `<div class="entry note"><div class="entry-head"><span class="muted">${escapeHtml(stamp)}</span> <span class="pill strong">${escapeHtml(event.door)} → ${escapeHtml(who)}</span></div><div class="say">${escapeHtml(event.text)}</div></div>`;
          case "join_completed":
            return `<div class="entry note">${head}<div>joined <code>${escapeHtml(event.parent.slice(0, 12))}</code>${event.conflicted ? " (conflicted)" : ""}${event.broke.length ? ` — broke: ${escapeHtml(event.broke.join(", "))}` : ""}</div></div>`;
          case "join_audit":
            return `<div class="entry note">${head}<div>audited ${event.parents.length} parent(s), ${event.outstanding} outstanding</div></div>`;
          case "run_failed":
            return `<div class="entry note">${head}<div class="error">${escapeHtml(event.reason)}</div></div>`;
          default:
            return `<div class="entry note unknown">${head}${bodyMarkup(JSON.stringify(event, null, 2), `${entry.seq}:raw`, "pre-body")}</div>`;
        }
      }

      function inScope(entry) {
        switch (scope.kind) {
          case "concern":
            return entry.actor.id === scope.id;
          case "actor":
            return actorLabel(entry.actor) === scope.label;
          default:
            return true;
        }
      }

      // Which actors the actor row offers: every one under the open concern,
      // or every one in the run when nothing is narrowed. Selecting an actor
      // keeps the concern it belongs to, so the two rows read as one path in.
      function scopedActors() {
        const concern = scope.kind === "merged" ? null : scope.id;
        const seen = [];
        for (const entry of entries) {
          const label = actorLabel(entry.actor);
          if (concern !== null && entry.actor.id !== concern) continue;
          if (!seen.includes(label)) seen.push(label);
        }
        return seen;
      }

      const chipMarkup = (label, text, active, key) =>
        `<button type="button" class="chip${active ? " current" : ""}" data-${key}="${escapeHtml(label)}">${escapeHtml(text)}</button>`;

      function renderScopes() {
        const ids = [];
        for (const entry of entries) {
          if (!ids.includes(entry.actor.id)) ids.push(entry.actor.id);
        }
        element("scope-chips").innerHTML = [
          chipMarkup("", "merged", scope.kind === "merged", "scope"),
          ...ids.map((id) => chipMarkup(id, id, scope.id === id, "scope")),
        ].join("");
      }

      function renderActors() {
        const labels = scopedActors();
        const all =
          scope.kind === "merged"
            ? []
            : [chipMarkup("", "whole concern", scope.kind === "concern", "actor")];
        element("actor-chips").innerHTML = [
          ...all,
          ...labels.map((label) =>
            chipMarkup(label, label, scope.label === label, "actor")
          ),
        ].join("");
      }

      function renderTrace() {
        const shown = entries.filter(inScope);
        element("trace-body").innerHTML = shown.map(entryMarkup).join("");
        element("trace-empty").hidden = shown.length > 0;
        renderScopes();
        renderActors();
        renderTarget();
      }

      function renderPhases() {
        const current = state.phases.indexOf(state.phase);
        element("phase-chips").innerHTML = state.phases
          .map((phase, index) => {
            const kind = phase === state.phase ? "current" : index < current ? "done" : "";
            return `<span class="chip ${kind}">${escapeHtml(phase)}</span>`;
          })
          .join("");
      }

      function renderReview() {
        const review = state.review;
        element("review-section").hidden = !review;
        if (!review) return;
        const verdict = review.final_review.accepted ? "accepted" : "rejected";
        const residual = review.final_review.residual.length
          ? `<p class="muted">Residual: ${escapeHtml(review.final_review.residual.join("; "))}</p>`
          : "";
        const checks = review.verification
          .map((check) => `<tr><td>${escapeHtml(check.name)}</td><td>${check.passed ? "passed" : "failed"}</td><td class="muted">exit ${check.exit_code}</td></tr>`)
          .join("");
        element("review-body").innerHTML =
          `<p><code>${escapeHtml(review.review_branch)}</code></p><p>Reviewer ${escapeHtml(verdict)}: ${escapeHtml(review.final_review.reason)}</p>${residual}<table><tbody>${checks}</tbody></table>`;
        element("review-hand-off").textContent =
          "This branch is yours to land — the resolver takes no decision here.";
      }

      function renderFailures() {
        element("failures-section").hidden = state.failures.length === 0;
        element("failure-list").innerHTML = state.failures
          .map((failure) => `<p class="error">${escapeHtml(failure)}</p>`)
          .join("");
      }

      function render() {
        if (!state) return;
        element("run-id").textContent = state.run_id;
        element("phase-pill").textContent = state.phase;
        const statusPill = element("status-pill");
        statusPill.textContent = state.status.replaceAll("_", " ");
        statusPill.className = `pill ${state.status === "failed" ? "danger" : state.status === "complete" ? "ok" : ""}`;
        const banner = element("banner");
        banner.hidden = state.live;
        banner.textContent = state.live
          ? ""
          : "This run is not moving. Answers you submit are held for its next run.";
        renderRuns();
        renderPhases();
        renderConcerns();
        renderTrace();
        renderQuestions();
        renderReview();
        renderFailures();
      }

      function setConnection(label, kind) {
        const pill = element("connection-pill");
        pill.textContent = label;
        pill.className = `pill ${kind}`;
      }

      async function hydrate() {
        const listing = await fetch("/api/runs");
        if (listing.ok) runs = (await listing.json()).runs;
        const path = state ? `/api/runs/${state.run_id}` : "/api/state";
        const response = await fetch(path);
        if (!response.ok) {
          renderRuns();
          setConnection("select a run", "");
          return;
        }
        state = await response.json();
        render();
      }

      async function selectRun(runId) {
        const response = await fetch(`/api/runs/${runId}`);
        if (!response.ok) return;
        state = await response.json();
        entries = [];
        expanded.clear();
        scope = { kind: "merged" };
        if (source) source.close();
        connect();
        render();
        renderTrace();
      }

      // Applying the record directly is what removed the re-project-and-diff
      // tick. A phase or concern move is folded here because the event carries
      // exactly what changed; anything derived from the mailbox — offers, the
      // operator-facing status — is re-read, because the run does not author
      // an offer and cannot have recorded it.
      const REPROJECTS = ["question_asked", "answer_settled", "run_failed"];

      // A long run outlives what a page can hold, so the oldest entries are
      // dropped rather than accumulated until the tab dies. The record on
      // disk is complete either way — this bounds the reader, not the run.
      const RETAINED_ENTRIES = 4000;

      function apply(entry) {
        entries.push(entry);
        if (entries.length > RETAINED_ENTRIES) entries.shift();
        renderTrace();
        if (!state) return;
        const event = entry.event;
        switch (event.type) {
          case "phase_changed":
            state = { ...state, phase: event.phase };
            render();
            break;
          case "concern_progressed":
            state = {
              ...state,
              concerns: state.concerns.map((concern) =>
                concern.id === event.progress.concern_id
                  ? { ...concern, status: event.progress.status, reason: event.progress.reason }
                  : concern
              ),
            };
            render();
            break;
        }
        if (REPROJECTS.includes(event.type)) hydrate();
      }

      async function post(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body ?? {}),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || "request failed");
        return payload;
      }

      function showError(id, error) {
        const node = element(id);
        node.hidden = false;
        node.textContent = error.message;
      }

      element("questions-form").addEventListener("input", () => {
        const draft = {};
        for (const answer of collectAnswers()) draft[answer.question_id] = answer.value;
        writeDraft(draft);
      });

      element("questions-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/answers`, { answers: collectAnswers() });
          localStorage.removeItem(draftKey());
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      element("run-rows").addEventListener("click", (event) => {
        const target = event.target.closest("[data-run]");
        if (target) selectRun(target.dataset.run);
      });

      element("resume-button").addEventListener("click", async () => {
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/resume`, {});
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      element("park-button").addEventListener("click", async () => {
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/park`, {});
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      element("scope-chips").addEventListener("click", (click) => {
        const chosen = click.target.closest("[data-scope]");
        if (!chosen) return;
        const id = chosen.dataset.scope;
        scope = id ? { kind: "concern", id } : { kind: "merged" };
        renderTrace();
      });

      element("actor-chips").addEventListener("click", (click) => {
        const chosen = click.target.closest("[data-actor]");
        if (!chosen) return;
        const label = chosen.dataset.actor;
        scope = label
          ? { kind: "actor", id: label.split(":")[1].split("#")[0], label }
          : { kind: "concern", id: scope.id };
        renderTrace();
      });

      // A concern row opens the whole concern — worker, reviewer and merger,
      // every round — because what a reader wants from a concern is what
      // happened to it, not what one of its three actors did. The chips
      // narrow from there and stay the way back out.
      element("concern-rows").addEventListener("click", (click) => {
        const chosen = click.target.closest("[data-concern]");
        if (!chosen) return;
        scope = { kind: "concern", id: chosen.dataset.concern };
        renderTrace();
        element("trace-section").scrollIntoView({ behavior: "smooth" });
      });

      element("trace-body").addEventListener("click", (click) => {
        const chosen = click.target.closest("[data-expand]");
        if (!chosen) return;
        expanded.add(chosen.dataset.expand);
        renderTrace();
      });

      // A message reaches one actor or all of them; the mailbox addresses an
      // exact label or broadcasts, and has nothing in between. A concern scope
      // therefore says so rather than silently picking one of its actors.
      function messageTarget() {
        return scope.kind === "actor" ? scope.label : "";
      }

      function renderTarget() {
        const target = messageTarget();
        element("message-target").textContent = target
          ? `Goes to ${target}.`
          : "Goes to every actor in this run. Pick an actor above to address one.";
      }

      element("message-button").addEventListener("click", async () => {
        const field = element("message-text");
        if (!field.value.trim()) return;
        element("message-error").hidden = true;
        try {
          await post(`/api/runs/${state.run_id}/messages`, {
            text: field.value,
            to_actor: messageTarget(),
          });
          field.value = "";
        } catch (error) {
          showError("message-error", error);
        }
      });

      function connect() {
        source = new EventSource(`/api/runs/${state.run_id}/events`);
        source.onopen = () => {
          setConnection("watching", "ok");
          hydrate();
        };
        source.onerror = () => setConnection("reconnecting", "danger");
        source.onmessage = (message) => apply(JSON.parse(message.data));
      }

      element("footer-url").textContent = window.location.origin;

      hydrate().then(() => {
        if (state) connect();
      });
    </script>
  </body>
</html>
