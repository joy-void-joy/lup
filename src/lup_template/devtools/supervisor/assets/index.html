<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lup resolver supervisor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #11151d;
        --panel-raised: #171c26;
        --border: #272e3d;
        --text: #edf1f7;
        --muted: #8e98aa;
        --accent: #9b8cff;
        --accent-strong: #b9adff;
        --ok: #64d6a2;
        --danger: #ff8292;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% -10%, #26204b 0, transparent 34rem),
          radial-gradient(circle at 90% 5%, #15344a 0, transparent 30rem),
          var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, select { font: inherit; }

      .shell {
        width: min(1000px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 72px;
      }

      header { margin-bottom: 26px; }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); letter-spacing: -.045em; }
      h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.02em; }
      p { margin: 0; }

      .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

      .pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px;
        background: var(--panel-raised);
        color: var(--muted);
        font-size: 13px;
      }

      .pill.strong { color: var(--text); border-color: var(--accent); }
      .pill.ok { color: var(--ok); border-color: var(--ok); }
      .pill.danger { color: var(--danger); border-color: var(--danger); }

      section {
        margin-top: 22px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
      }

      section[hidden] { display: none; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; }

      .chip {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px 9px;
        color: var(--muted);
        font-size: 12px;
      }

      .chip.done { color: var(--ok); border-color: #2c5a46; }
      .chip.current { color: var(--text); background: var(--panel-raised); border-color: var(--accent); }

      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      td.reason { color: var(--muted); }
      tr:last-child td { border-bottom: 0; }

      fieldset {
        margin: 0 0 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--panel-raised);
      }

      legend { padding: 0 6px; color: var(--accent-strong); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }

      .prompt { margin-bottom: 10px; }

      .choice { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
      .choice input { margin-top: 4px; }

      .badge {
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        background: #241f45;
        color: var(--accent-strong);
        font-size: 11px;
      }

      input[type="text"] {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #0c1017;
        color: var(--text);
      }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

      button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 16px;
        background: var(--panel-raised);
        color: var(--text);
        cursor: pointer;
      }

      button.primary { background: var(--accent); border-color: var(--accent); color: #14101f; font-weight: 650; }
      button.danger { border-color: var(--danger); color: var(--danger); }
      button:disabled { opacity: .5; cursor: not-allowed; }

      code {
        display: block;
        margin-top: 10px;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #0c1017;
        color: var(--accent-strong);
        font-size: 12.5px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .error { margin-top: 10px; color: var(--danger); }
      .muted { color: var(--muted); }
      .banner { margin-top: 12px; color: var(--muted); }
      footer { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <p class="eyebrow">Resolver supervision</p>
        <h1 id="run-id">—</h1>
        <div class="pills">
          <span class="pill strong" id="phase-pill">—</span>
          <span class="pill" id="status-pill">—</span>
          <span class="pill" id="connection-pill">connecting</span>
        </div>
        <p class="banner" id="banner" hidden></p>
      </header>

      <section id="runs-section">
        <h2>Runs</h2>
        <table>
          <thead>
            <tr><th>Run</th><th>Phase</th><th>Concerns</th><th>Pending</th><th>Decision</th></tr>
          </thead>
          <tbody id="run-rows"></tbody>
        </table>
        <p class="muted" id="runs-empty" hidden>No runs recorded under .lup/resolve.</p>
      </section>

      <section id="phases-section">
        <h2>Phases</h2>
        <div class="chips" id="phase-chips"></div>
      </section>

      <section id="concerns-section">
        <h2>Concerns</h2>
        <table>
          <thead>
            <tr>
              <th>Concern</th><th>Status</th><th>Reason</th>
              <th>Depends on</th><th>Branch</th><th>Rounds</th>
            </tr>
          </thead>
          <tbody id="concern-rows"></tbody>
        </table>
        <p class="muted" id="concerns-empty" hidden>No concerns planned yet.</p>
      </section>

      <section id="questions-section" hidden>
        <h2>Pending questions</h2>
        <form id="questions-form"></form>
        <div class="actions" id="questions-actions">
          <button class="primary" type="submit" form="questions-form">Submit answers</button>
          <button type="button" id="park-button">Park run</button>
          <button type="button" id="resume-button" hidden>Resume run</button>
        </div>
        <p class="error" id="questions-error" hidden></p>
        <code id="rerun-recipe" hidden></code>
      </section>

      <section id="review-section" hidden>
        <h2>Review branch</h2>
        <div id="review-body"></div>
        <div class="actions" id="review-actions">
          <button class="primary" type="button" id="accept-button">Accept branch</button>
          <button class="danger" type="button" id="reject-button">Reject</button>
        </div>
        <p class="error" id="review-error" hidden></p>
      </section>

      <section id="failures-section" hidden>
        <h2>Failures</h2>
        <div id="failure-list"></div>
      </section>

      <footer>
        <span id="footer-url"></span>
      </footer>
    </div>

    <script>
      let state = null;
      let source = null;
      let runs = [];

      const element = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function draftKey() {
        return `lup-supervisor:${state.run_id}`;
      }

      function readDraft() {
        try {
          return JSON.parse(localStorage.getItem(draftKey()) || "{}");
        } catch (error) {
          return {};
        }
      }

      function writeDraft(answers) {
        localStorage.setItem(draftKey(), JSON.stringify(answers));
      }

      function collectAnswers() {
        const form = element("questions-form");
        const answers = [];
        for (const field of form.querySelectorAll("[data-question]")) {
          if (field.type === "radio" && !field.checked) continue;
          if (field.value === "") continue;
          answers.push({ question_id: field.dataset.question, value: field.value });
        }
        return answers;
      }

      function questionMarkup(view, draft) {
        const question = view.question;
        if (view.answered !== null) {
          return `<div class="prompt">${escapeHtml(question.prompt)}</div><p class="muted">Answered <strong>${escapeHtml(view.answered)}</strong></p>`;
        }
        const chosen = draft[question.id] ?? view.offer ?? undefined;
        const offered = view.offer !== null ? '<span class="badge">offered</span>' : "";
        const body = question.choices.length
          ? question.choices.map((choice) => {
              const checked = chosen === choice || (chosen === undefined && question.recommendation === choice);
              const badge = question.recommendation === choice ? '<span class="badge">recommended</span>' : "";
              return `<label class="choice"><input type="radio" name="${escapeHtml(question.id)}" data-question="${escapeHtml(question.id)}" value="${escapeHtml(choice)}"${checked ? " checked" : ""} /><span>${escapeHtml(choice)}${badge}</span></label>`;
            }).join("")
          : `<input type="text" data-question="${escapeHtml(question.id)}" value="${escapeHtml(chosen ?? question.recommendation ?? "")}" autocomplete="off" />`;
        return `<div class="prompt">${escapeHtml(question.prompt)}${offered}</div>${body}`;
      }

      function renderQuestions() {
        const section = element("questions-section");
        const pending = state.pending;
        const outstanding = pending.filter((view) => view.answered === null);
        section.hidden = pending.length === 0;
        element("questions-actions").hidden = outstanding.length === 0;
        element("rerun-recipe").hidden = outstanding.length === 0;
        element("rerun-recipe").textContent = state.rerun_recipe;
        element("resume-button").hidden = state.live;
        const draft = readDraft();
        const grouped = new Map();
        for (const view of pending) {
          const concern = view.question.concern_id;
          if (!grouped.has(concern)) grouped.set(concern, []);
          grouped.get(concern).push(view);
        }
        element("questions-form").innerHTML = [...grouped.entries()]
          .map(([concern, views]) =>
            `<fieldset><legend>${escapeHtml(concern)}</legend>${views.map((view) => questionMarkup(view, draft)).join("")}</fieldset>`
          )
          .join("");
      }

      function renderRuns() {
        const rows = runs.map((run) => {
          const decision = run.accepted === null ? "—" : run.accepted ? "accepted" : "rejected";
          const badge = run.live ? ' <span class="badge">live</span>' : "";
          const detail = run.unreadable ? `<div class="error">${escapeHtml(run.detail)}</div>` : "";
          const current = run.run_id === state.run_id ? " strong" : "";
          return `<tr><td><button type="button" class="pill${current}" data-run="${escapeHtml(run.run_id)}">${escapeHtml(run.run_id)}</button>${badge}${detail}</td><td class="muted">${escapeHtml(run.phase || "—")}</td><td>${run.concerns}</td><td>${run.pending_questions}</td><td class="muted">${decision}</td></tr>`;
        });
        element("run-rows").innerHTML = rows.join("");
        element("runs-empty").hidden = rows.length > 0;
      }

      function renderConcerns() {
        const rows = state.concerns.map((concern) => {
          const failure = concern.failure ? `<div class="error">${escapeHtml(concern.failure)}</div>` : "";
          const approved = concern.integration_approved ? "" : ' <span class="badge">deferred</span>';
          return `<tr><td><strong>${escapeHtml(concern.id)}</strong>${approved}<div class="muted">${escapeHtml(concern.title)}</div></td><td>${escapeHtml(concern.status)}</td><td class="reason">${escapeHtml(concern.reason || concern.eligibility_reason || "")}${failure}</td><td class="muted">${escapeHtml(concern.dependencies.join(", ") || "—")}</td><td class="muted">${escapeHtml(concern.branch || "—")}</td><td>${concern.rounds}</td></tr>`;
        });
        element("concern-rows").innerHTML = rows.join("");
        element("concerns-empty").hidden = rows.length > 0;
      }

      function renderPhases() {
        const current = state.phases.indexOf(state.phase);
        element("phase-chips").innerHTML = state.phases
          .map((phase, index) => {
            const kind = phase === state.phase ? "current" : index < current ? "done" : "";
            return `<span class="chip ${kind}">${escapeHtml(phase)}</span>`;
          })
          .join("");
      }

      function renderReview() {
        const review = state.review;
        element("review-section").hidden = !review;
        if (!review) return;
        const verdict = review.final_review.accepted ? "accepted" : "rejected";
        const residual = review.final_review.residual.length
          ? `<p class="muted">Residual: ${escapeHtml(review.final_review.residual.join("; "))}</p>`
          : "";
        const checks = review.verification
          .map((check) => `<tr><td>${escapeHtml(check.name)}</td><td>${check.passed ? "passed" : "failed"}</td><td class="muted">exit ${check.exit_code}</td></tr>`)
          .join("");
        element("review-body").innerHTML =
          `<p><code>${escapeHtml(review.review_branch)}</code></p><p>Reviewer ${escapeHtml(verdict)}: ${escapeHtml(review.final_review.reason)}</p>${residual}<table><tbody>${checks}</tbody></table>`;
        element("review-actions").hidden = state.decision !== null;
      }

      function renderFailures() {
        element("failures-section").hidden = state.failures.length === 0;
        element("failure-list").innerHTML = state.failures
          .map((failure) => `<p class="error">${escapeHtml(failure)}</p>`)
          .join("");
      }

      function render() {
        if (!state) return;
        element("run-id").textContent = state.run_id;
        element("phase-pill").textContent = state.phase;
        const statusPill = element("status-pill");
        statusPill.textContent = state.status.replaceAll("_", " ");
        statusPill.className = `pill ${state.status === "failed" ? "danger" : state.status === "complete" ? "ok" : ""}`;
        const banner = element("banner");
        banner.hidden = state.live;
        banner.textContent = state.live
          ? ""
          : "This run is not moving. Answers you submit are held for its next run.";
        renderRuns();
        renderPhases();
        renderConcerns();
        renderQuestions();
        renderReview();
        renderFailures();
      }

      function setConnection(label, kind) {
        const pill = element("connection-pill");
        pill.textContent = label;
        pill.className = `pill ${kind}`;
      }

      async function hydrate() {
        const listing = await fetch("/api/runs");
        if (listing.ok) runs = (await listing.json()).runs;
        const path = state ? `/api/runs/${state.run_id}` : "/api/state";
        const response = await fetch(path);
        if (!response.ok) return;
        state = await response.json();
        render();
      }

      async function selectRun(runId) {
        const response = await fetch(`/api/runs/${runId}`);
        if (!response.ok) return;
        state = await response.json();
        if (source) source.close();
        connect();
        render();
      }

      function apply(payload) {
        if (!state) return;
        switch (payload.type) {
          case "phase":
            state = { ...state, phase: payload.phase };
            break;
          case "concern":
            state = {
              ...state,
              concerns: state.concerns.map((concern) =>
                concern.id === payload.progress.concern_id
                  ? { ...concern, status: payload.progress.status, reason: payload.progress.reason }
                  : concern
              ),
            };
            break;
          case "questions":
            state = { ...state, pending: payload.pending };
            break;
          case "review":
            state = { ...state, review: payload.review };
            break;
          case "status":
            state = { ...state, status: payload.status };
            break;
        }
        render();
      }

      async function post(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body ?? {}),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || "request failed");
        return payload;
      }

      function showError(id, error) {
        const node = element(id);
        node.hidden = false;
        node.textContent = error.message;
      }

      element("questions-form").addEventListener("input", () => {
        const draft = {};
        for (const answer of collectAnswers()) draft[answer.question_id] = answer.value;
        writeDraft(draft);
      });

      element("questions-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/answers`, { answers: collectAnswers() });
          localStorage.removeItem(draftKey());
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      element("run-rows").addEventListener("click", (event) => {
        const target = event.target.closest("[data-run]");
        if (target) selectRun(target.dataset.run);
      });

      element("resume-button").addEventListener("click", async () => {
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/resume`, {});
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      element("park-button").addEventListener("click", async () => {
        element("questions-error").hidden = true;
        try {
          state = await post(`/api/runs/${state.run_id}/park`, {});
          render();
        } catch (error) {
          showError("questions-error", error);
        }
      });

      for (const [id, accepted] of [["accept-button", true], ["reject-button", false]]) {
        element(id).addEventListener("click", async () => {
          element("review-error").hidden = true;
          try {
            state = await post(`/api/runs/${state.run_id}/decision`, { accepted });
            render();
          } catch (error) {
            showError("review-error", error);
          }
        });
      }

      function connect() {
        source = new EventSource(`/api/runs/${state.run_id}/events`);
        source.onopen = () => {
          setConnection("watching", "ok");
          hydrate();
        };
        source.onerror = () => setConnection("reconnecting", "danger");
        source.onmessage = (message) => apply(JSON.parse(message.data));
      }

      element("footer-url").textContent = window.location.origin;

      hydrate().then(() => {
        if (state) connect();
      });
    </script>
  </body>
</html>
