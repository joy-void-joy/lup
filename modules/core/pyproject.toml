[project]
# The core's package imports as `lup`. Its distribution is named apart from it
# while this repository's lock also pins the second lup's `lup-dev`, which
# depends on a distribution named `lup`: uv refuses two sources for one name in a
# lock, whatever group each comes from.
name = "lup-core"
version = "0.0.0"
description = "lup's core: the declaration's grammar, the doors a module is reached through, and the submodules every project has."
requires-python = ">=3.15"
# typer is lup's command line, which a shipped project's own command runs too
# (`lup/command_line/README.md`).
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    "typer>=0.29",
]

[project.optional-dependencies]
# What the environment side needs beyond running a project's modules: checking
# promises, where hypothesis draws and shrinks what they explore. lup's own
# workspace and a project's gate install it; a shipped project's command doesn't.
environment = [
    "hypothesis>=6.170",
]

# `lup`, the command line for developing with lup, over the declaration of the
# worktree it runs in (`lup/command_line/README.md`).
[project.scripts]
lup = "lup.environment.command_line:main"

# pytest runs lup's plugin wherever the core is installed, checking the promises
# of the modules a project's declaration resolves to (`lup/testing/README.md`).
[project.entry-points.pytest11]
lup = "lup.environment.testing.plugin"

[tool.uv.build-backend]
module-name = "lup"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
