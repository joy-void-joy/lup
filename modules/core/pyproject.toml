[project]
# The core's package imports as `lup`. Its distribution is named apart from it
# while this repository's lock also pins the second lup's `lup-dev`, which
# depends on a distribution named `lup`: uv refuses two sources for one name in a
# lock, whatever group each comes from.
name = "lup-core"
version = "0.0.0"
description = "lup's core: the declaration's grammar, the doors a module is reached through, and the submodules every project has."
requires-python = ">=3.15"
# typer is lup's command line, which a shipped project's own command runs too
# (`lup/command_line/README.md`).
dependencies = [
    # Bounds on a field's value, which pydantic checks and hypothesis draws
    # within wherever the field's type nests them: pydantic's own dependency.
    "annotated-types>=0.7",
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    "typer>=0.29",
    # The store's database: its tables declared once in Python and its queries
    # built from them (`lup/store/README.md`), Core alone, not the ORM.
    "sqlalchemy>=2",
    # The version a program a part declares reports, tested against the
    # specifier its `Program` field says (`lup/doors/parts.py`).
    "packaging>=26",
    # Where the machine keeps its parts' data, its environments and what lasts
    # while it runs, in each platform's own places (`lup/hosting/README.md`).
    "platformdirs>=4",
    # lup's one library for retrying what's transient: the loader waiting for
    # the machine it started to answer (`lup/hosting/README.md`, *The loader*).
    "tenacity>=9",
]

[project.optional-dependencies]
# What the environment side needs beyond running a project's modules: checking
# promises, where hypothesis draws and shrinks what they explore. lup's own
# workspace and a project's gate install it; a shipped project's command doesn't.
environment = [
    "hypothesis>=6.170",
]
# The dashboard's server: the page, and one socket carrying what it watches.
# Only what serves the dashboard needs it, never a module's code.
dashboard = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    # The socket's protocol, which uvicorn speaks only with it installed.
    "websockets>=15",
]

# `lup`, the command line for developing with lup, over the declaration of the
# worktree it runs in (`lup/command_line/README.md`).
[project.scripts]
lup = "lup.environment.command_line:main"
# The process holding one session over its runtime's input and output, which
# the machine starts per session and tells what to do (`lup/sessions/README.md`).
lup-hold = "lup.environment.sessions.holder:main"

# pytest runs lup's plugin wherever the core is installed, checking the promises
# of the modules a project's declaration resolves to (`lup/testing/README.md`).
[project.entry-points.pytest11]
lup = "lup.environment.testing.plugin"

[tool.uv.build-backend]
module-name = "lup"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
