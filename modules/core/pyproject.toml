[project]
# The core's package imports as `lup`. Its distribution is named apart from it
# while this repository's lock also pins the second lup's `lup-dev`, which
# depends on a distribution named `lup`: uv refuses two sources for one name in a
# lock, whatever group each comes from.
name = "lup-core"
version = "0.0.0"
description = "lup's core: the declaration's grammar, the doors a module is reached through, and the submodules every project has."
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    # The store's database: its tables declared once in Python and its queries
    # built from them (`lup/store/README.md`), Core alone, not the ORM.
    "sqlalchemy>=2",
]

[project.optional-dependencies]
# Checking promises: hypothesis draws and shrinks what they explore. A project's
# gate installs it; what runs a project's modules doesn't need it.
testing = [
    "hypothesis>=6.170",
]

# pytest runs lup's plugin wherever the core is installed, checking the promises
# of the modules a project's declaration resolves to (`lup/testing/README.md`).
[project.entry-points.pytest11]
lup = "lup.environment.testing.plugin"

[tool.uv.build-backend]
module-name = "lup"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
