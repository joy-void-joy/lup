repos:
  - repo: local
    hooks:
      - id: lup-harness-generate
        name: regenerate Lup native harness artifacts
        entry: uv run lup-devtools harness generate all
        language: system
        pass_filenames: false
        # Matches generation inputs (the harness devtools and the lup library
        # they compile) plus the owned native trees reconciliation reads.
        # Commits outside these paths run no generation; the read-only CI
        # drift gate covers every push. See docs/quality-pipeline.md.
        files: |
          (?x)^(
            src/lup_template/devtools/harness/
            | packages/lup/src/lup/
            | \.claude/
            | \.codex/
            | \.agents/
            | AGENTS\.md$
          )
