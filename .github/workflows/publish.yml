# Generated from lup.devtools.dev.workflow by `uv run lup-devtools harness generate all` — edit the source, not this file.
# See docs/harness.md.

name: Publish

'on':
  push:
    tags: [v*]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # What stands in for a stored token: the forge mints an identity for this
    # run, and the index trusts it for this repository and this workflow.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build the distribution
        run: uv build --package lup
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
