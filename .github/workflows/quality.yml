# Generated from lup.devtools.dev.workflow by `uv run lup-devtools harness generate all` — edit the source, not this file.
# See docs/harness.md.

name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/lup/web
      - run: uv sync --all-extras
      - name: Merge driver
        run: uv run lup-devtools git merge-driver
      - name: Generated artifact drift
        run: uv run lup-devtools harness check all
      - name: Quality gate
        run: uv run lup-devtools dev check
