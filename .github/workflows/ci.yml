name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  # Live two-backend lane: parity test, sandbox, serve-tools round-trips.
  # Costs real LLM calls — nightly schedule or manual dispatch only, with
  # a hard budget cap enforced through the rates below.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_MAX_BUDGET_USD: "2.00"
      CODEX_USD_PER_MTOK_INPUT: "1.25"
      CODEX_USD_PER_MTOK_OUTPUT: "10.00"
      CODEX_USD_PER_MTOK_CACHED_INPUT: "0.125"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -m integration
