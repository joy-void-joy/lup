# claude: Very uncertain about having a CI here. Maybe we should remove it for now. What do you think
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly integration lane
    - cron: "0 7 * * 1" # weekly codex pin canary
  workflow_dispatch:

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q

  # Live two-backend lane: parity test, sandbox, serve-tools round-trips.
  # Costs real LLM calls — nightly schedule or manual dispatch only, with
  # a hard budget cap enforced through the rates below.
  integration:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_MAX_BUDGET_USD: "2.00"
      CODEX_USD_PER_MTOK_INPUT: "1.25"
      CODEX_USD_PER_MTOK_OUTPUT: "10.00"
      CODEX_USD_PER_MTOK_CACHED_INPUT: "0.125"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -m integration

  # Codex SDK staleness canary: build against the latest upstream tag and
  # run the unit suite. Green = a pin bump is one edit away (and the moment
  # to re-probe codex hooks / dynamicTools — see PLAN.md, Deferred Work);
  # red = upstream broke the SDK surface this repo uses, caught before a
  # contributor hits it.
  codex-pin-canary:
    if: github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Point the openai-codex pin at the latest upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/openai/codex/releases/latest --jq .tag_name)
          echo "Latest upstream tag: $latest"
          sed -i "s|tag = \"rust-v[^\"]*\"|tag = \"$latest\"|" pyproject.toml
          git diff pyproject.toml
      - run: uv sync
      - run: uv run pytest -q
